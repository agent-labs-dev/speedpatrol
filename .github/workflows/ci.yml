name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version:` here: it is read from package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check --error-on-warnings
      - run: pnpm knip
      - run: pnpm build
      # The npm package is a bundle of the workspace, so a break in the bundle
      # must fail here, not in a release.
      - run: pnpm --filter speedpatrol build
      - run: node packages/speedpatrol/dist/bin.js --version
      # The probe and agent tests drive real processes and a real Chromium.
      - run: pnpm --filter @speedpatrol/probes exec playwright install --with-deps chromium
      - run: pnpm test
