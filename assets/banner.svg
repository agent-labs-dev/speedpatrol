    <rect x="66" y="196" width="20" height="20" rx="3.5"/>
    <rect x="92" y="196" width="20" height="20" rx="3.5"/>
  </g>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="178" fill="#f8fafc" font-size="96" font-weight="800" letter-spacing="-2">speed<tspan fill="#fbbf24">patrol</tspan></text>
    <text x="404" y="237.52" fill="#cbd5e1" font-size="27.84" font-weight="500">AI agents that measure your app and make it faster.</text>
    <rect x="400" y="266.32" width="339.84" height="59.52" rx="13.44" fill="#0b0f1f" stroke="#fbbf24" stroke-opacity="0.5" stroke-width="2"/>
    <text x="421.12" y="305.68" fill="#fbbf24" font-size="28.8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ <tspan fill="#f8fafc">npx speedpatrol</tspan></text>
  </g>
