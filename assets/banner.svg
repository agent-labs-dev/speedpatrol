    <rect x="144" y="40" width="20" height="20" rx="3.5"/>
    <rect x="170" y="40" width="20" height="20" rx="3.5"/>
    <rect x="92" y="66" width="20" height="20" rx="3.5"/>
    <rect x="118" y="66" width="20" height="20" rx="3.5"/>
    <rect x="144" y="66" width="20" height="20" rx="3.5"/>
    <rect x="66" y="92" width="20" height="20" rx="3.5"/>
    <rect x="92" y="92" width="20" height="20" rx="3.5"/>
    <rect x="118" y="92" width="20" height="20" rx="3.5"/>
    <rect x="40" y="118" width="20" height="20" rx="3.5"/>
    <rect x="66" y="118" width="20" height="20" rx="3.5"/>
    <rect x="92" y="118" width="20" height="20" rx="3.5"/>
    <rect x="118" y="118" width="20" height="20" rx="3.5"/>
    <rect x="144" y="118" width="20" height="20" rx="3.5"/>
    <rect x="170" y="118" width="20" height="20" rx="3.5"/>
    <rect x="118" y="144" width="20" height="20" rx="3.5"/>
    <rect x="144" y="144" width="20" height="20" rx="3.5"/>
    <rect x="170" y="144" width="20" height="20" rx="3.5"/>
